[package]
name = "re3bevy_game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
profiling = []
profile-capture = []

[dependencies]
bevy.workspace = true
bevy_enhanced_input.workspace = true
bytemuck = { version = "1.24", features = ["derive"] }
re3bevy_assets.workspace = true
re3bevy_core.workspace = true
re3bevy_formats.workspace = true
# Original GTA III mission dialogue WAVs use IMA ADPCM. Bevy's plain `wav`
# feature only enables the PCM decoder, so keep Rodio's pure-Rust Symphonia
# RIFF + ADPCM codecs in the unified audio feature set.
rodio.workspace = true

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
