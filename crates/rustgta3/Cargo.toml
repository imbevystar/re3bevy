[package]
name = "rustgta3"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "rustgta3"

[features]
# Bevy's built-in ECS/render tracing plus rustgta3's deeper hot-path spans.
# Tracy is opt-in so normal gameplay carries no profiling collection overhead.
profiling = [
    "bevy/trace_tracy",
    "bevy/debug",
    "rustgta3_game/profiling",
    "dep:tracy-client-sys",
]
profiling-memory = [
    "bevy/trace_tracy_memory",
    "bevy/debug",
    "rustgta3_game/profiling",
    "dep:tracy-client-sys",
]
profiling-chrome = ["bevy/trace_chrome", "bevy/debug", "rustgta3_game/profiling"]
profiling-toggle = [
    "dep:bevy_app",
    "bevy_app/trace",
    "dep:bevy_ecs",
    "bevy_ecs/debug",
    "bevy_ecs/trace",
    "rustgta3_game/profile-capture",
    "dep:serde_json",
]

[dependencies]
bevy.workspace = true
bevy_app = { version = "0.20.0", optional = true, default-features = false }
bevy_ecs = { version = "0.20.0", optional = true, default-features = false }
rustgta3_assets.workspace = true
rustgta3_core.workspace = true
rustgta3_dev_arena.workspace = true
rustgta3_game.workspace = true
tracy-client-sys = { version = "=0.30.0", optional = true, default-features = false }
serde_json = { version = "1.0", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
bevy = { workspace = true, features = ["dynamic_linking", "bevy_gilrs"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-game-activity"] }
