name = "taxi_full_throttle_90_frames"
domain = "scenario"
reference = "re3"
description = "Observe a TAXI handling automobile drive core over 90 flat-contact frames with full throttle, no brake, no steer, and no handbrake."
asset_root_config = "config/original_gta3_path.txt"
relative_path = "DATA/HANDLING.CFG"
seed = 1

[setup]
model = "taxi"
handling = "TAXI"
position = [0.0, 0.0, 10.0]
heading_degrees = 0.0
count = 90
throttle = 1.0
brake = 0.0
steer = 0.0
handbrake = false

[observe]
fields = [
  "setup.model",
  "setup.handling",
  "setup.frames",
  "setup.throttle",
  "setup.brake",
  "setup.steer",
  "setup.handbrake",
  "snapshots.frame",
  "snapshots.position",
  "snapshots.right",
  "snapshots.forward",
  "snapshots.up",
  "snapshots.move_speed",
  "snapshots.turn_speed",
  "snapshots.gear",
  "snapshots.engine_revs",
  "snapshots.steer_angle",
  "snapshots.wheel_rotation",
  "snapshots.wheel_suspension",
  "snapshots.health",
  "snapshots.damage"
]

[tolerance]
default = 0.0005
frame = 0
frames = 0
gear = 0
health = 0.0
engine = 0
wheel = 0
position = 0.005
move_speed = 0.0005
turn_speed = 0.0005
right = 0.0005
forward = 0.0005
up = 0.0005
wheel_rotation = 0.0005
wheel_suspension = 0.0005
steer_angle = 0.0005
engine_revs = 0.0005

[references]
cpp = [
  "references/re-GTA/src/vehicles/Automobile.cpp",
  "references/re-GTA/src/vehicles/Automobile.h",
  "references/re-GTA/src/vehicles/Vehicle.cpp",
  "references/re-GTA/src/vehicles/Vehicle.h",
  "references/re-GTA/src/vehicles/Transmission.cpp",
  "references/re-GTA/src/vehicles/Transmission.h",
  "references/re-GTA/src/vehicles/HandlingMgr.cpp",
  "references/re-GTA/src/vehicles/HandlingMgr.h",
  "references/re-GTA/src/entities/Physical.cpp",
  "references/re-GTA/src/entities/Physical.h",
  "references/re-GTA/src/core/Timer.h"
]
rust = [
  "crates/re3bevy_game/src/vehicles/Automobile.rs",
  "crates/re3bevy_game/src/vehicles/Vehicle.rs",
  "crates/re3bevy_game/src/vehicles/Transmission.rs",
  "crates/re3bevy_game/src/vehicles/HandlingMgr.rs",
  "crates/re3bevy_game/src/entities/Physical.rs"
]
