name = "save_load_slot_roundtrip"
domain = "scenario"
reference = "re3"
description = "Roundtrip a deterministic PC save slot image through re3 GenericGameStorage block layout, checksum, padding, slot metadata, and generic load split."
seed = 1

[setup]
slot = 2
slot_file = "GTA3sf3.b"
save_name = "PORTLAND TEST"
date = "08 JUL 2026 21:30:15"

[observe]
fields = [
  "setup.slot",
  "setup.slot_file",
  "setup.generic_block_count",
  "setup.save_size_field",
  "setup.work_buff_size",
  "blocks.index",
  "blocks.kind",
  "blocks.payload_size",
  "blocks.aligned_size",
  "roundtrip.image_len",
  "roundtrip.checksum",
  "roundtrip.parsed_checksum",
  "roundtrip.bytes_processed",
  "roundtrip.parsed_block_count",
  "roundtrip.padding_block_count",
  "roundtrip.level_to_load",
  "roundtrip.loaded_block_count",
  "roundtrip.loaded_checksum",
  "roundtrip.byte_equal",
  "slot_info.state",
  "slot_info.name",
  "slot_info.date",
  "slot_info.level_to_load",
  "simple_vars.save_name",
  "simple_vars.save_size",
  "simple_vars.curr_level",
  "simple_vars.camera_position",
  "simple_vars.clock",
  "simple_vars.timer_ms",
  "simple_vars.frame_counter",
  "simple_vars.weather",
  "simple_vars.compile_date",
  "simple_vars.zoom",
  "scripts.payload_size",
  "scripts.aligned_size"
]

[tolerance]
default = 0
camera_position = 0
interpolation = 0
car = 0.000001
ped = 0.000001

[references]
cpp = [
  "references/re-GTA/src/save/GenericGameStorage.cpp",
  "references/re-GTA/src/save/GenericGameStorage.h",
  "references/re-GTA/src/save/PCSave.cpp",
  "references/re-GTA/src/save/PCSave.h",
  "references/re-GTA/src/core/main.h"
]
rust = [
  "crates/re3bevy_game/src/save/GenericGameStorage.rs",
  "crates/re3bevy_game/src/save/PCSave.rs",
  "crates/re3bevy_game/src/save/SaveBuf.rs"
]
