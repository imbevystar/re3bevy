name = "cutscene_hanim_archive_inventory"
domain = "scenario"
reference = "re3"
asset_root_config = "config/original_gta3_path.txt"
description = "Enumerate every HAnim .ANM member in CUTS.DIR/CUTS.IMG and compare directory order, sector ranges, RW HAnim headers, and boundary keyframe bytes."

[observe]
fields = [
  "summary.directory_entry_count",
  "summary.anm_count",
  "summary.total_size_sectors",
  "summary.total_keyframes",
  "summary.file_checksum_accumulator",
  "summary.duration_bits_accumulator",
  "entries.anm_index",
  "entries.directory_index",
  "entries.name",
  "entries.offset_sectors",
  "entries.size_sectors",
  "entries.byte_len",
  "entries.file_checksum",
  "entries.chunk_length",
  "entries.chunk_version",
  "entries.type_id",
  "entries.flags",
  "entries.num_keyframes",
  "entries.custom_data_size",
  "entries.duration_bits",
  "entries.duration_seconds",
  "entries.keyframe_size",
  "entries.payload_bytes",
  "entries.expected_payload_bytes",
  "entries.payload_size_matches",
  "entries.first_keyframe_checksum",
  "entries.last_keyframe_checksum",
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/core/Directory.cpp",
  "references/re-GTA/src/animation/CutsceneMgr.cpp",
  "references/re-GTA/src/objects/CutsceneHead.cpp",
  "references/re-GTA/src/fakerw/rwplcore.h",
  "references/re-GTA/src/fakerw/rphanim.h",
]
rust = [
  "crates/re3bevy_assets/src/assets/AnimationAssets.rs",
  "crates/re3bevy_formats/src/formats/HAnimRead.rs",
]
