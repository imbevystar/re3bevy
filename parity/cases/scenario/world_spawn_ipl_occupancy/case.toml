name = "world_spawn_ipl_occupancy"
domain = "world"
reference = "re3"
description = "Observe real IPL world occupancy in the XY radius around MAIN.SCM CREATE_PLAYER spawn."
asset_root_config = "config/original_gta3_path.txt"
default_relative_path = "DATA/DEFAULT.DAT"
gta3_relative_path = "DATA/GTA3.DAT"

[setup]
spawn = [811.875, -939.938, 35.75]
radius = 250.0

[observe]
fields = [
  "spawn",
  "radius",
  "ipl_entity_count",
  "near_spawn_count"
]

[tolerance]
default = 0
spawn = 0.0005
radius = 0.0
ipl_entity_count = 0
near_spawn_count = 0

[references]
cpp = [
  "references/re-GTA/src/core/FileLoader.cpp",
  "references/re-GTA/src/core/World.cpp",
  "references/re-GTA/src/control/Script.cpp"
]
rust = [
  "crates/re3bevy_game/src/core/FileLoader.rs",
  "crates/re3bevy_game/src/core/World.rs",
  "crates/re3bevy_game/src/core/Game.rs"
]
