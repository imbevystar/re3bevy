name = "frontend_main_menu_layout"
domain = "scenario"
reference = "re3"
description = "Observe PC frontend start-menu sprite, logo, title, selected-bar, option text layout, colours, alignment, and shadow offsets."

[setup]
count = 3

[observe]
fields = [
  "selected_option",
  "order",
  "kind",
  "texture",
  "text_key",
  "entry_index",
  "selected",
  "left",
  "top",
  "right",
  "bottom",
  "x",
  "y",
  "style",
  "scale_x",
  "scale_y",
  "align",
  "colour",
  "shadow_colour",
  "foreground_offset_x",
  "foreground_offset_y"
]

[tolerance]
default = 0.000001
order = 0
entry_index = 0
style = 0
colour = 0
shadow_colour = 0

[references]
cpp = [
  "references/re-GTA/src/core/Frontend.cpp",
  "references/re-GTA/src/core/Frontend.h",
  "references/re-GTA/src/core/MenuScreens.cpp",
  "references/re-GTA/src/core/common.h",
  "references/re-GTA/src/renderer/Font.cpp",
  "references/re-GTA/src/renderer/Sprite2d.cpp"
]
rust = [
  "crates/re3bevy_game/src/core/FrontendFlow.rs",
  "crates/re3bevy_game/src/core/Frontend.rs",
  "crates/re3bevy_game/src/core/MenuScreens.rs",
  "crates/re3bevy_game/src/renderer/Font.rs"
]
