name = "streaming_initial_requests"
domain = "scenario"
reference = "re3"
description = "Observe CGame startup initial streaming request decisions after LoadInitialVehicles, LoadInitialPeds, and RequestBigBuildings(LEVEL_GENERIC), before LoadAllRequestedModels drains the queue."
asset_root_config = "config/original_gta3_path.txt"
default_relative_path = "DATA/DEFAULT.DAT"
gta3_relative_path = "DATA/GTA3.DAT"

[setup]
level = 0
load_all_requested_models = false

[observe]
fields = [
  "setup.default_dat_size",
  "setup.gta3_dat_size",
  "setup.ide_file_count",
  "setup.ipl_file_count",
  "setup.model_info_count",
  "setup.big_building_count",
  "setup.requested_count",
  "setup.priority_count",
  "setup.has_loaded_lods",
  "setup.num_vehicles_loaded",
  "setup.last_vehicle_deleted",
  "requests.index",
  "requests.stream_id",
  "requests.kind",
  "requests.name",
  "requests.load_state",
  "requests.flags",
  "requests.dont_remove",
  "requests.priority",
  "requests.txd_slot",
  "requests.txd_name"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/core/Game.cpp",
  "references/re-GTA/src/core/Streaming.cpp",
  "references/re-GTA/src/core/Streaming.h",
  "references/re-GTA/src/core/FileLoader.cpp",
  "references/re-GTA/src/modelinfo/ModelInfo.cpp",
  "references/re-GTA/src/modelinfo/ModelIndices.h",
  "references/re-GTA/src/modelinfo/SimpleModelInfo.cpp",
  "references/re-GTA/src/core/Zones.cpp"
]
rust = [
  "crates/re3bevy_game/src/core/Game.rs",
  "crates/re3bevy_game/src/core/Streaming.rs",
  "crates/re3bevy_game/src/core/FileLoader.rs",
  "crates/re3bevy_game/src/core/World.rs",
  "crates/re3bevy_game/src/modelinfo/ModelInfo.rs",
  "crates/re3bevy_game/src/modelinfo/ModelIndices.rs"
]
