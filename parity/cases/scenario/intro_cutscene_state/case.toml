name = "intro_cutscene_state"
domain = "scenario"
reference = "re3"
description = "Observe CCutsceneMgr INTRO load, start, loading-state progression, finish, and delete state."

[observe]
fields = [
  "snapshots.label",
  "snapshots.loaded",
  "snapshots.running",
  "snapshots.anim_loaded",
  "snapshots.processing",
  "snapshots.use_lod_multiplier",
  "snapshots.name",
  "snapshots.load_status",
  "snapshots.timer_ms",
  "snapshots.offset",
  "snapshots.object_count"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/animation/CutsceneMgr.cpp",
  "references/re-GTA/src/animation/CutsceneMgr.h",
  "references/re-GTA/src/control/Script3.cpp"
]
rust = [
  "crates/re3bevy_game/src/animation/CutsceneMgr.rs"
]
