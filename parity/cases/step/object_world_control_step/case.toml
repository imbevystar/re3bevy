name = "object_world_control_step"
domain = "object"
reference = "re3"
description = "Observe a non-static CObject ProcessControl force update followed by CPhysical world movement integration."

[observe]
fields = [
  "moved",
  "position",
  "move_speed",
  "distance_travelled",
  "is_static",
]

[tolerance]
default = 0.000001
moved = 0
is_static = 0

[references]
cpp = [
  "references/re-GTA/src/objects/Object.cpp",
  "references/re-GTA/src/entities/Physical.cpp",
]
rust = [
  "crates/re3bevy_game/src/objects/Object.rs",
  "crates/re3bevy_game/src/entities/Physical.rs",
]
