name = "vehicle_component_damage_thresholds"
domain = "vehicle"
reference = "re3"
description = "Observe CDamageManager component-group multipliers and strict scaled-damage >150 progression boundary for wheels, doors, bonnet, front panel, and bumper."

[setup]
threshold = 150.0
components = ["wheel_front_left", "door_front_left", "bonnet", "panel_front_left", "bumper_front"]

[observe]
fields = [
  "snapshots.index",
  "snapshots.component",
  "snapshots.applied",
  "snapshots.wheel0",
  "snapshots.door0",
  "snapshots.door2",
  "snapshots.panel0",
  "snapshots.panel5",
  "snapshots.light0",
  "snapshots.engine"
]

[tolerance]
default = 0.000001
index = 0
component = 0
applied = 0
wheel0 = 0
door0 = 0
door2 = 0
panel0 = 0
panel5 = 0
light0 = 0
engine = 0

[references]
cpp = [
  "references/re-GTA/src/vehicles/DamageManager.cpp",
  "references/re-GTA/src/vehicles/DamageManager.h"
]
rust = ["crates/re3bevy_game/src/vehicles/DamageManager.rs"]
