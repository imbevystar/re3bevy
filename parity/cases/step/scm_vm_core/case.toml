name = "scm_vm_core"
image_file = "image.hex"

# Frame clock inputs (CTimer::GetTimeInMilliseconds per Process) and the
# per-frame UpdateTimers step (CTimer::GetTimeStepInMilliseconds).
# The mission thread terminates at t=64 and the main thread spawns thread_c
# at t=128, so slot reuse through the idle list is observed as well.
timer_ms = [0, 16, 32, 48, 64, 80, 96, 112, 128, 144, 160]
time_step_ms = 16

[tolerance]
default = 0
