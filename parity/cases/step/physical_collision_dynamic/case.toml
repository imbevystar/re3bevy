name = "physical_collision_dynamic"
domain = "physics"
reference = "re3"
description = "Observe CPhysical::ApplyCollision for two movable vehicle bodies, including effective masses, rebound impulses and vehicle force/torque scaling."

[observe]
fields = [
  "applied",
  "impulse_a",
  "impulse_b",
  "move_a",
  "turn_a",
  "move_b",
  "turn_b"
]

[tolerance]
default = 0.000001
applied = 0

[references]
cpp = [
  "references/re-GTA/src/entities/Physical.cpp",
  "references/re-GTA/src/entities/Physical.h"
]
rust = [
  "crates/re3bevy_game/src/entities/Physical.rs"
]
