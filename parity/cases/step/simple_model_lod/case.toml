name = "simple_model_lod"
domain = "step"
reference = "re3"
description = "Observe CSimpleModelInfo normal/damaged atomic selection and largest LOD distance at exact threshold boundaries."

[observe]
fields = [
  "snapshots.index",
  "snapshots.label",
  "snapshots.model_id",
  "snapshots.num_atomics",
  "snapshots.first_damaged",
  "snapshots.distance_bits",
  "snapshots.lod_multiplier_bits",
  "snapshots.damaged",
  "snapshots.selected_atomic",
  "snapshots.largest_lod_distance_bits"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/modelinfo/SimpleModelInfo.cpp",
  "references/re-GTA/src/modelinfo/SimpleModelInfo.h",
  "references/re-GTA/src/core/Camera.cpp"
]
rust = [
  "crates/re3bevy_game/src/modelinfo/SimpleModelInfo.rs"
]
