name = "player_zelda_control_step"
domain = "ped"
reference = "re3"
description = "Observe ten PlayerControlZelda input steps: pad magnitude, camera-relative destination heading, acceleration, heading-rate turn and sprint state."

[setup]
frames = 10
left_right = 128
up_down = -128
sprint = true
camera_orientation = 0.3
time_step = 0.6
dt_seconds = 0.012

[observe]
fields = [
  "input",
  "snapshots.frame",
  "snapshots.moved",
  "snapshots.move_speed",
  "snapshots.rotation_dest",
  "snapshots.rotation_cur",
  "snapshots.move_state"
]

[tolerance]
default = 0.000001
frame = 0
moved = 0
move_speed = 0.000001
rotation_dest = 0.000001
rotation_cur = 0.000001

[references]
cpp = [
  "references/re-GTA/src/peds/PlayerPed.cpp",
  "references/re-GTA/src/peds/Ped.cpp",
  "references/re-GTA/src/core/General.h"
]
rust = [
  "crates/re3bevy_game/src/peds/PlayerPed.rs",
  "crates/re3bevy_game/src/peds/Ped.rs",
  "crates/re3bevy_core/src/core/General.rs"
]
