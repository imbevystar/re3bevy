name = "random_sequence"
domain = "step"
reference = "re3"
description = "Observe CGeneral::GetRandomNumber using the default PC myrand path."

[setup]
seed = 1
count = 16

[observe]
fields = [
  "index",
  "value",
  "seed_after"
]

[tolerance]
default = 0
value = 0
seed_after = 0

[references]
cpp = [
  "references/re-GTA/src/core/re3.cpp",
  "references/re-GTA/src/core/General.h",
  "references/re-GTA/src/core/common.h"
]
rust = [
  "crates/re3bevy_core/src/core/General.rs"
]

