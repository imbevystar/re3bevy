name = "physical_collision_ped_vehicle"
domain = "physics"
reference = "re3"
description = "Observe CPhysical::ApplyCollision vehicle-to-ped mass factors and opposite ped move/turn response."

[observe]
fields = [
  "applied",
  "impulse_vehicle",
  "impulse_ped",
  "vehicle_move",
  "ped_move",
  "ped_turn",
]

[tolerance]
default = 0.000001
applied = 0

[references]
cpp = [
  "references/re-GTA/src/entities/Physical.cpp",
  "references/re-GTA/src/peds/Ped.cpp",
]
rust = [
  "crates/re3bevy_game/src/entities/Physical.rs",
  "crates/re3bevy_game/src/peds/Ped.rs",
]
