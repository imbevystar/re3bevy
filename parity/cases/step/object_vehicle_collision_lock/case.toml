name = "object_vehicle_collision_lock"
domain = "object"
reference = "re3"
description = "Observe the ProcessCollisionSectorList lock that suppresses repeated vehicle impulses until an uprooted object's bounds separate."

[observe]
fields = [
  "skip_while_touching",
  "retained_slot",
  "skip_after_separation",
  "released",
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/entities/Physical.cpp",
]
rust = [
  "crates/re3bevy_game/src/objects/Object.rs",
  "crates/re3bevy_game/src/core/Game.rs",
]
