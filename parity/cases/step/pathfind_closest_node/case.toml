name = "pathfind_closest_node"
domain = "pathfind"
reference = "re3"
description = "Observe FindNodeClosestToCoors car/ped ranges, 3x vertical distance, disabled/between-level filters, unkBits eligibility, and strict distance limit."

[setup]
car_nodes = 3
ped_nodes = 2

[observe]
fields = [
  "snapshots.index",
  "snapshots.path_type",
  "snapshots.ignore_disabled",
  "snapshots.ignore_between",
  "snapshots.result"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/control/PathFind.cpp",
  "references/re-GTA/src/control/PathFind.h"
]
rust = ["crates/re3bevy_game/src/control/PathFind.rs"]
