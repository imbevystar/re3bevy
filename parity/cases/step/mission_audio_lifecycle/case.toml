name = "mission_audio_lifecycle"
domain = "audio"
reference = "re3"
description = "Observe PC mission-audio preload, service loading, play permission, service start/backend visibility, 3D location, and clear state transitions."

[setup]
sample = 123
location = [1.0, 2.0, 3.0]

[observe]
fields = [
  "snapshots.index",
  "snapshots.sample",
  "snapshots.loading",
  "snapshots.play",
  "snapshots.allowed",
  "snapshots.playing",
  "snapshots.is_2d"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/audio/AudioLogic.cpp",
  "references/re-GTA/src/audio/AudioManager.h"
]
rust = [
  "crates/re3bevy_game/src/audio/AudioManager.rs",
  "crates/re3bevy_game/src/core/Game.rs"
]
