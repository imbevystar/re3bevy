name = "clock_update"
domain = "step"
reference = "re3"
description = "Observe CClock::Update minute/second progression from explicit CTimer millisecond snapshots."

[setup]
milliseconds_per_game_minute = 1000
timer_ms = [0, 999, 1000, 1001, 2001, 61001, 62002]
debug_fast_forward = false

[observe]
fields = [
  "index",
  "timer_ms",
  "hours",
  "minutes",
  "seconds",
  "days_passed"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/core/Clock.cpp",
  "references/re-GTA/src/core/Clock.h",
  "references/re-GTA/src/core/Timer.h"
]
rust = [
  "crates/re3bevy_core/src/core/Clock.rs",
  "crates/re3bevy_core/src/core/Timer.rs"
]

