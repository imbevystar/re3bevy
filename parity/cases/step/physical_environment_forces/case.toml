name = "physical_environment_forces"
domain = "physical"
reference = "re3"
description = "Observe gravity, accumulated friction consumption and both CPhysical air-resistance branches."

[setup]
time_step = 1.25
move_speed = [1.2, -0.8, 0.4]
turn_speed = [0.3, -0.2, 0.1]
move_friction = [-0.1, 0.05, -0.02]
turn_friction = [0.01, -0.03, 0.02]
air_resistance = [0.85, 0.05]

[observe]
fields = [
  "time_step",
  "snapshots.index",
  "snapshots.air_resistance",
  "snapshots.move_speed",
  "snapshots.turn_speed",
  "snapshots.move_friction",
  "snapshots.turn_friction"
]

[tolerance]
default = 0.000001
index = 0
air_resistance = 0.000001
move_speed = 0.000001
turn_speed = 0.000001
move_friction = 0.0
turn_friction = 0.0

[references]
cpp = [
  "references/re-GTA/src/entities/Physical.cpp",
  "references/re-GTA/src/entities/Physical.h"
]
rust = ["crates/re3bevy_game/src/entities/Physical.rs"]
