name = "cutscene_audio_tracks"
domain = "step"
reference = "re3"
description = "Compare CCutsceneMgr cutscene audio track name/id mapping, including case-insensitive lookup and the A1_SS0 spelling."

[observe]
fields = [
  "summary.track_count",
  "summary.first_name",
  "summary.first_track_id",
  "summary.last_name",
  "summary.last_track_id",
  "summary.name_checksum",
  "summary.id_checksum",
  "lookups.name",
  "lookups.track_id",
  "tracks.index",
  "tracks.name",
  "tracks.track_id"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/animation/CutsceneMgr.cpp",
  "references/re-GTA/src/audio/audio_enums.h"
]
rust = [
  "crates/re3bevy_game/src/animation/CutsceneMgr.rs"
]
