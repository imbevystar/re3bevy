name = "wanted_chaos_thresholds"
domain = "wanted"
reference = "re3"
description = "Observe CWanted chaos cap and every star/law-enforcer/cops/roadblock threshold boundary."

[setup]
chaos_values = [-1, 0, 39, 40, 199, 200, 399, 400, 799, 800, 1599, 1600, 3199, 3200, 6401]
now_ms = 12345

[observe]
fields = [
  "snapshots.index",
  "snapshots.input_chaos",
  "snapshots.chaos",
  "snapshots.level",
  "snapshots.vehicles",
  "snapshots.max_cops",
  "snapshots.roadblock_density",
  "snapshots.last_change_ms"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/core/Wanted.cpp",
  "references/re-GTA/src/core/Wanted.h"
]
rust = ["crates/re3bevy_game/src/core/Wanted.rs"]
