name = "wanted_update_decay_slots"
domain = "wanted"
reference = "re3"
description = "Observe CWanted::Update timed chaos decay, police-presence suppression, level>1 no-decay branch, and cop pursuit slot compaction/counting."

[setup]
now_ms = 1001
initial_last_update = 0
cop_slots = ["10", "empty", "20", "empty", "30", "empty", "empty", "empty", "empty", "empty"]
scenarios = [
  "one_star_no_police",
  "one_star_police_present",
  "two_star_no_decay"
]

[observe]
fields = [
  "snapshots.index",
  "snapshots.scenario",
  "snapshots.chaos",
  "snapshots.level",
  "snapshots.last_update",
  "snapshots.last_change_ms",
  "snapshots.current_cops",
  "snapshots.cop_slots"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/core/Wanted.cpp",
  "references/re-GTA/src/core/Wanted.h"
]
rust = ["crates/re3bevy_game/src/core/Wanted.rs"]
