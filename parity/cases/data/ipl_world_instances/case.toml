name = "ipl_world_instances"
domain = "data"
reference = "re3"
description = "Parse DAT-referenced IPL world records like CFileLoader::LoadScene."
asset_root_config = "config/original_gta3_path.txt"

[setup]
default_relative_path = "DATA/DEFAULT.DAT"
gta3_relative_path = "DATA/GTA3.DAT"

[observe]
fields = [
  "asset_fingerprint.default_dat_size",
  "asset_fingerprint.gta3_dat_size",
  "asset_fingerprint.ipl_file_count",
  "asset_fingerprint.record_count",
  "files.index",
  "files.path",
  "files.size",
  "files.record_count",
  "records.index",
  "records.file_index",
  "records.file_path",
  "records.local_index",
  "records.kind",
  "records.id",
  "records.name",
  "records.position",
  "records.scale",
  "records.rotation_axis",
  "records.angle",
  "records.zone_type",
  "records.min",
  "records.max",
  "records.level",
  "records.flags",
  "records.wanted_level_drop"
]

[tolerance]
default = 0
position = 0.0001
scale = 0.0001
rotation_axis = 0.0001
angle = 0.0001
min = 0.0001
max = 0.0001

[references]
cpp = [
  "references/re-GTA/src/core/FileLoader.cpp",
  "references/re-GTA/src/core/FileLoader.h"
]
rust = [
  "crates/re3bevy_formats/src/formats/FileLoader.rs"
]
