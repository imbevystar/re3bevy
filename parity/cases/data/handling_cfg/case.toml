name = "handling_cfg"
domain = "data"
reference = "re3"
description = "Parse DATA/HANDLING.CFG raw records: order, vehicle name, field count, and every token before game-unit conversion."
asset_root_config = "config/original_gta3_path.txt"

[setup]
relative_path = "DATA/HANDLING.CFG"

[observe]
fields = [
  "asset_fingerprint.handling_cfg_size",
  "records.index",
  "records.name",
  "records.field_count",
  "records.fields"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/vehicles/HandlingMgr.cpp",
  "references/re-GTA/src/vehicles/HandlingMgr.h"
]
rust = [
  "crates/re3bevy_formats/src/formats/DataRead.rs"
]

