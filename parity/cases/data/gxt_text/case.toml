name = "gxt_text"
domain = "data"
reference = "re3"
description = "Parse TEXT/AMERICAN.GXT TKEY entries and TDAT text payload offsets like CText."
asset_root_config = "config/original_gta3_path.txt"

[setup]
relative_path = "TEXT/AMERICAN.GXT"

[observe]
fields = [
  "asset_fingerprint.gxt_size",
  "asset_fingerprint.tkey_bytes",
  "asset_fingerprint.tdat_bytes",
  "asset_fingerprint.tdat_code_units",
  "entries.index",
  "entries.key",
  "entries.value_offset",
  "entries.text_units_hex"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/text/Text.cpp",
  "references/re-GTA/src/text/Text.h"
]
rust = [
  "crates/re3bevy_formats/src/formats/Text.rs"
]
