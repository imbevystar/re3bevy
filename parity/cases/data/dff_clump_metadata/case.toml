name = "dff_clump_metadata"
domain = "data"
reference = "re3"
description = "Parse DAT MODELFILE clumps and compare frame hierarchy, local matrix payloads, node names, and atomic-to-frame bindings."
asset_root_config = "config/original_gta3_path.txt"

[setup]
default_relative_path = "DATA/DEFAULT.DAT"
gta3_relative_path = "DATA/GTA3.DAT"

[observe]
fields = [
  "asset_fingerprint.default_dat_size",
  "asset_fingerprint.gta3_dat_size",
  "asset_fingerprint.dff_file_count",
  "asset_fingerprint.frame_count",
  "asset_fingerprint.named_frame_count",
  "asset_fingerprint.root_frame_count",
  "asset_fingerprint.atomic_count",
  "files.index",
  "files.path",
  "files.size",
  "files.num_atomics",
  "files.num_lights",
  "files.num_cameras",
  "files.num_frames",
  "files.parsed_frame_count",
  "files.num_geometries",
  "files.atomic_chunks",
  "files.root_frame_name",
  "frames.index",
  "frames.file_index",
  "frames.frame_index",
  "frames.parent_index",
  "frames.matrix_flags",
  "frames.name",
  "frames.right_bits",
  "frames.up_bits",
  "frames.at_bits",
  "frames.position_bits",
  "frames.child_count",
  "frames.atomic_count",
  "atomics.index",
  "atomics.file_index",
  "atomics.atomic_index",
  "atomics.frame_index",
  "atomics.geometry_index",
  "atomics.flags",
  "atomics.frame_name"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/rw/ClumpRead.cpp",
  "references/re-GTA/src/fakerw/fake.cpp",
  "references/re-GTA/src/fakerw/rwcore.h",
  "references/re-GTA/vendor/librw@5501c4fdc7425ff926be59369a13593bb6c81b54/src/frame.cpp"
]
rust = [
  "crates/re3bevy_formats/src/formats/ClumpRead.rs"
]
