name = "surface_dat"
domain = "data"
reference = "re3"
description = "Parse DATA/SURFACE.DAT into the CSurfaceTable 5x5 symmetric adhesive limit matrix."
asset_root_config = "config/original_gta3_path.txt"

[setup]
relative_path = "DATA/SURFACE.DAT"

[observe]
fields = [
  "asset_fingerprint.surface_dat_size",
  "rows.index",
  "rows.name",
  "matrix"
]

[tolerance]
default = 0
matrix = 0.000001

[references]
cpp = [
  "references/re-GTA/src/core/SurfaceTable.cpp",
  "references/re-GTA/src/core/SurfaceTable.h"
]
rust = [
  "crates/re3bevy_formats/src/formats/DataRead.rs",
  "crates/re3bevy_game/src/core/SurfaceTable.rs"
]

