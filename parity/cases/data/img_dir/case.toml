name = "img_dir"
domain = "data"
reference = "re3"
description = "Parse MODELS/GTA3.DIR fixed 32-byte IMG directory entries like CDirectory."
asset_root_config = "config/original_gta3_path.txt"

[setup]
relative_path = "MODELS/GTA3.DIR"

[observe]
fields = [
  "asset_fingerprint.dir_size",
  "asset_fingerprint.entry_byte_len",
  "asset_fingerprint.entry_count",
  "entries.index",
  "entries.offset",
  "entries.size",
  "entries.name"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/core/Directory.cpp",
  "references/re-GTA/src/core/Directory.h"
]
rust = [
  "crates/re3bevy_formats/src/formats/Directory.rs"
]
