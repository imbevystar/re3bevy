name = "ide_modelinfo"
domain = "data"
reference = "re3"
description = "Parse DAT-referenced IDE modelinfo records like CFileLoader::LoadObjectTypes."
asset_root_config = "config/original_gta3_path.txt"

[setup]
default_relative_path = "DATA/DEFAULT.DAT"
gta3_relative_path = "DATA/GTA3.DAT"

[observe]
fields = [
  "asset_fingerprint.default_dat_size",
  "asset_fingerprint.gta3_dat_size",
  "asset_fingerprint.ide_file_count",
  "asset_fingerprint.record_count",
  "files.index",
  "files.path",
  "files.size",
  "files.record_count",
  "records.index",
  "records.file_index",
  "records.file_path",
  "records.local_index",
  "records.kind",
  "records.id",
  "records.model",
  "records.txd",
  "records.num_objs",
  "records.distances",
  "records.flags",
  "records.first_damaged",
  "records.time_on",
  "records.time_off",
  "records.vehicle_type",
  "records.handling_id",
  "records.game_name",
  "records.vehicle_class",
  "records.frequency",
  "records.level",
  "records.component_rules",
  "records.misc",
  "records.wheel_scale",
  "records.ped_type",
  "records.ped_stats",
  "records.anim_group",
  "records.cars_can_drive",
  "records.path_type",
  "records.model_name",
  "records.node_type",
  "records.next",
  "records.cross",
  "records.position",
  "records.width",
  "records.num_left",
  "records.num_right",
  "records.color",
  "records.effect_type"
]

[tolerance]
default = 0
distances = 0.00001
wheel_scale = 0.000001
position = 0.00001
width = 0.000001

[references]
cpp = [
  "references/re-GTA/src/core/FileLoader.cpp",
  "references/re-GTA/src/core/FileLoader.h"
]
rust = [
  "crates/re3bevy_formats/src/formats/FileLoader.rs"
]
