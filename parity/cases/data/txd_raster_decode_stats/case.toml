name = "txd_raster_decode_stats"
domain = "data"
reference = "re3"
description = "Decode DAT TEXDICTION TXD first-mip raster payloads into RGBA byte stats."
asset_root_config = "config/original_gta3_path.txt"

[setup]
default_relative_path = "DATA/DEFAULT.DAT"
gta3_relative_path = "DATA/GTA3.DAT"

[observe]
fields = [
  "asset_fingerprint.default_dat_size",
  "asset_fingerprint.gta3_dat_size",
  "asset_fingerprint.txd_file_count",
  "asset_fingerprint.texture_count",
  "asset_fingerprint.decoded_texture_count",
  "files.index",
  "files.path",
  "files.size",
  "files.num_textures",
  "files.decoded_textures",
  "textures.index",
  "textures.file_index",
  "textures.texture_index",
  "textures.platform_id",
  "textures.name",
  "textures.mask",
  "textures.raster_format",
  "textures.d3d_format",
  "textures.width",
  "textures.height",
  "textures.depth",
  "textures.num_levels",
  "textures.palette_len",
  "textures.source_mip_size",
  "textures.source_mip_checksum",
  "textures.decoded",
  "textures.rgba_len",
  "textures.rgba_checksum",
  "textures.alpha_zero_count",
  "textures.alpha_nonzero_count",
  "textures.rgba_head",
  "textures.rgba_tail"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/rw/TexRead.cpp"
]
rust = [
  "crates/re3bevy_formats/src/formats/TexRead.rs"
]
