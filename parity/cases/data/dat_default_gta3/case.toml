name = "dat_default_gta3"
domain = "data"
reference = "re3"
description = "Parse DATA/DEFAULT.DAT and DATA/GTA3.DAT into CFileLoader LoadLevel command plans."
asset_root_config = "config/original_gta3_path.txt"

[setup]
default_relative_path = "DATA/DEFAULT.DAT"
gta3_relative_path = "DATA/GTA3.DAT"

[observe]
fields = [
  "asset_fingerprint.default_dat_size",
  "asset_fingerprint.gta3_dat_size",
  "files.role",
  "files.path",
  "files.commands.index",
  "files.commands.kind",
  "files.commands.level",
  "files.commands.path"
]

[tolerance]
default = 0

[references]
cpp = [
  "references/re-GTA/src/core/FileLoader.cpp",
  "references/re-GTA/src/core/FileLoader.h"
]
rust = [
  "crates/re3bevy_formats/src/formats/FileLoader.rs"
]

